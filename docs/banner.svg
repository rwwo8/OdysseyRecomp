<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Odyssey Recomp">
  <!-- README banner: the project's own icon (docs/icon, tools/make_icon.py: a red ring and a white compass star) on the
       launcher's night sky (runtime/ui/launcher.mm, runtime/ui/theme.h). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123447"/>
      <stop offset="1" stop-color="#071822"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6CCDF0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6CCDF0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#sky)"/>
    <!-- a planet's rim along the bottom, as on the launcher -->
    <ellipse cx="640" cy="1180" rx="1150" ry="860" fill="none" stroke="#6CCDF0" stroke-opacity="0.18" stroke-width="2"/>
    <g fill="#FFFFFF">
      <circle cx="70" cy="48" r="1.6" opacity="0.7"/><circle cx="388" cy="34" r="1.2" opacity="0.5"/>
      <circle cx="560" cy="300" r="1.4" opacity="0.5"/><circle cx="742" cy="40" r="1.8" opacity="0.8"/>
      <circle cx="905" cy="318" r="1.2" opacity="0.5"/><circle cx="1012" cy="62" r="1.5" opacity="0.6"/>
      <circle cx="1188" cy="120" r="1.9" opacity="0.8"/><circle cx="1236" cy="292" r="1.3" opacity="0.5"/>
      <circle cx="1110" cy="226" r="1.1" opacity="0.4"/><circle cx="130" cy="318" r="1.3" opacity="0.5"/>
      <circle cx="652" cy="96" r="1.0" opacity="0.4"/><circle cx="845" cy="160" r="1.2" opacity="0.4"/>
    </g>
    <circle cx="225" cy="180" r="175" fill="url(#glow)"/>
    <!-- the icon, 220 px -->
    <g transform="translate(115,70) scale(0.2148)">
      <circle cx="512" cy="512" r="337.92" fill="none" stroke="#E5383B" stroke-width="81.92"/>
      <polygon points="512,271.36 556.893,467.107 752.64,512 556.893,556.893 512,752.64 467.107,556.893 271.36,512 467.107,467.107" fill="#F2F6F8"/>
    </g>
    <g font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="400" y="168" font-size="78" font-weight="700" fill="#F2F6F8">Odyssey Recomp</text>
      <text x="402" y="222" font-size="30" fill="#9CC3D3">A native PC port of Super Mario Odyssey</text>
      <text x="402" y="274" font-size="22" fill="#6CCDF0" letter-spacing="3">WINDOWS  ·  LINUX  ·  MACOS</text>
    </g>
  </g>
</svg>
